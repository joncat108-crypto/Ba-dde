<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140c26">
<title>A little something for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#fdf3e7;
    --muted:rgba(253,243,231,.64);
    --gold:#f2c98a;
    --rose:#f0a6b4;
    --serif:'Cormorant Garamond','Iowan Old Style','Palatino Linotype',Georgia,serif;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:#100a20;color:var(--ink);font-family:var(--sans);
    overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  }

  /* ---------- atmosphere ---------- */
  .sky{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 0%,#2d1b48 0%,#180f2c 55%,#0d0817 100%)}
  .warm{
    position:fixed;inset:0;opacity:0;transition:opacity 2.6s ease;
    background:
      radial-gradient(90% 60% at 50% 105%,rgba(242,160,128,.34),transparent 62%),
      radial-gradient(80% 55% at 50% -5%,rgba(240,166,180,.22),transparent 68%);
  }
  body.lit .warm{opacity:1}
  .dim{position:fixed;inset:0;background:#04020a;opacity:0;transition:opacity .9s ease;pointer-events:none;z-index:3}
  body.dark .dim{opacity:.6}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #bg{z-index:1}
  #fx{z-index:5;pointer-events:none}

  /* ---------- scenes ---------- */
  .scene{
    position:fixed;inset:0;z-index:2;display:flex;overflow-y:auto;
    padding:calc(env(safe-area-inset-top,0px) + 28px) 24px calc(env(safe-area-inset-bottom,0px) + 28px);
    opacity:0;visibility:hidden;
    transition:opacity 1s ease,visibility 0s linear 1s;
  }
  .scene.active{opacity:1;visibility:visible;transition:opacity 1.4s ease .15s,visibility 0s}
  .inner{margin:auto;width:min(100%,540px);text-align:center}

  /* soft, staggered fades (no sliding) */
  .fade{opacity:0;transition:opacity 1.4s ease}
  .scene.active .fade{opacity:1;transition-delay:calc(var(--d,0) * 1s)}

  /* ---------- scene 1 ---------- */
  .hero{
    font-family:var(--serif);font-style:italic;font-weight:400;
    font-size:clamp(3.2rem,15vw,5.8rem);line-height:1.02;letter-spacing:-.01em;
  }
  .hero .n{color:var(--gold)}
  .sub{margin-top:1.1rem;color:var(--muted);font-weight:300;font-size:1rem;letter-spacing:.02em}
  .open-wrap{margin-top:2.6rem}
  .btn{
    position:relative;font:inherit;font-size:.95rem;font-weight:400;letter-spacing:.06em;color:var(--ink);
    background:rgba(255,255,255,.05);border:1px solid rgba(242,201,138,.55);border-radius:999px;
    padding:.95rem 2.6rem;cursor:pointer;transition:background .3s,border-color .3s,transform .3s;
  }
  .btn::after{
    content:"";position:absolute;inset:-1px;border-radius:inherit;border:1px solid rgba(242,201,138,.5);
    animation:halo 3.2s ease-out infinite;pointer-events:none;
  }
  @keyframes halo{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.35,1.9);opacity:0}}
  .btn:hover{background:rgba(242,201,138,.12);border-color:var(--gold)}
  .btn:active{transform:scale(.98)}
  .btn:focus-visible,.link:focus-visible,.cake:focus-visible,.sound:focus-visible{outline:2px solid var(--gold);outline-offset:4px}

  /* ---------- scene 2 : the cake ---------- */
  .wish{
    font-family:var(--serif);font-style:italic;font-weight:400;
    font-size:clamp(2.1rem,9vw,3rem);line-height:1.1;
  }
  .cake{
    position:relative;width:min(74vw,300px);margin:1.4rem auto 0;cursor:pointer;border-radius:12px;
    aspect-ratio:300/330;
  }
  .cake svg{width:100%;height:100%;display:block;overflow:visible}
  #flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 2.3s ease-in-out infinite}
  @keyframes flick{
    0%,100%{transform:scale(1,1) rotate(-1.5deg)}
    25%{transform:scale(.96,1.06) rotate(1.6deg)}
    50%{transform:scale(1.03,.97) rotate(-1deg)}
    75%{transform:scale(.98,1.04) rotate(1deg)}
  }
  #glow{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.72;transform:scale(1.07)}}
  .cake.out #flame{animation:none;transform:scale(.15);opacity:0;transition:transform .35s ease,opacity .3s ease}
  .cake.out #glow{animation:none;opacity:0;transition:opacity .5s ease}
  .ring{
    position:absolute;left:50%;top:23%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    border:1px solid rgba(242,201,138,.7);animation:ping 2.4s ease-out infinite;pointer-events:none;
  }
  @keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}}
  .cake.out .ring{display:none}
  .smoke{
    position:absolute;left:50%;top:24%;width:12px;height:12px;border-radius:50%;
    background:rgba(255,255,255,.4);filter:blur(7px);opacity:0;pointer-events:none;
  }
  .cake.out .smoke{animation:smoke 2.2s ease-out forwards;animation-delay:var(--sd,0s)}
  @keyframes smoke{
    0%{opacity:0;transform:translate(-50%,0) scale(.6)}
    20%{opacity:.55}
    100%{opacity:0;transform:translate(calc(-50% + var(--sx,0px)),-110px) scale(3.4)}
  }
  .hint{margin-top:1.6rem;color:var(--muted);font-weight:300;font-size:.98rem;letter-spacing:.02em;transition:opacity .5s ease}
  .hint.gone{opacity:0 !important;transition-delay:0s !important}
  .link{
    margin-top:.9rem;font:inherit;font-size:.85rem;font-weight:300;color:rgba(253,243,231,.5);
    background:none;border:0;padding:.5rem .8rem;cursor:pointer;text-decoration:underline;text-underline-offset:4px;
    text-decoration-color:rgba(253,243,231,.25);transition:color .3s,opacity .5s;
  }
  .link:hover{color:var(--ink)}
  .link.gone{opacity:0 !important;pointer-events:none}

  /* ---------- scene 3 : the reveal ---------- */
  .title{display:block;font-family:var(--serif);font-style:italic;font-weight:500;line-height:1.02}
  .title .l1{display:block;font-size:clamp(2.7rem,12vw,4.8rem);letter-spacing:-.01em}
  .title .l2{display:block;margin-top:.15em;font-size:clamp(2.3rem,10vw,3.8rem);color:var(--gold);font-weight:400}
  .title .l2:empty{display:none}
  .ch{display:inline-block;opacity:0;transform:translateY(.35em);filter:blur(6px)}
  #s3.active .ch{animation:chIn 1.1s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i) * 55ms + .35s)}
  @keyframes chIn{to{opacity:1;transform:none;filter:blur(0)}}
  .word{display:inline-block;white-space:nowrap}
  .rule{width:44px;height:1px;background:var(--gold);opacity:.7;margin:2rem auto 1.8rem}
  .message{
    max-width:34ch;margin:0 auto;font-size:1.06rem;line-height:1.75;font-weight:300;color:rgba(253,243,231,.9);
  }
  .reasons{list-style:none;padding:0;margin:2.2rem auto 0;max-width:30ch}
  .reasons li{
    font-family:var(--serif);font-style:italic;font-size:1.32rem;line-height:1.4;color:var(--ink);
  }
  .reasons li + li{margin-top:1.15rem}
  .reasons li + li::before{
    content:"";display:block;width:16px;height:1px;background:var(--rose);opacity:.65;margin:0 auto 1.15rem;
  }
  .from{margin-top:2.4rem;font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--gold)}
  .from:empty{display:none}
  .again{margin-top:1.4rem}

  /* ---------- sound toggle ---------- */
  .sound{
    position:fixed;z-index:6;right:calc(env(safe-area-inset-right,0px) + 16px);top:calc(env(safe-area-inset-top,0px) + 14px);
    width:40px;height:40px;border-radius:50%;border:1px solid rgba(253,243,231,.22);background:rgba(255,255,255,.05);
    color:var(--ink);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity 1.2s ease,background .3s;
  }
  .sound.show{opacity:.85}
  .sound:hover{background:rgba(255,255,255,.12)}
  .sound svg{width:18px;height:18px}
  .sound .waves{transition:opacity .2s}
  .sound.off .waves{opacity:0}
  .sound .slash{opacity:0;transition:opacity .2s}
  .sound.off .slash{opacity:1}

  @media (prefers-reduced-motion:reduce){
    .btn::after,.ring,#flame,#glow{animation:none}
    .fade{transition-duration:.01s}
  }
</style>
</head>
<body>

<div class="sky"></div>
<div class="warm"></div>
<canvas id="bg"></canvas>
<div class="dim"></div>
<canvas id="fx"></canvas>

<button class="sound" id="sound" aria-label="Toggle music" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/>
    <path class="waves" d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/>
    <path class="slash" d="M16 9.5l5 5M21 9.5l-5 5"/>
  </svg>
</button>

<!-- 1 · invitation -->
<section class="scene active" id="s1" aria-live="polite">
  <div class="inner">
    <h1 class="hero fade" style="--d:.4"><span id="forLine"></span></h1>
    <p class="sub fade" style="--d:1">Made just for today.</p>
    <div class="open-wrap fade" style="--d:1.6"><button class="btn" id="openBtn">Open</button></div>
  </div>
</section>

<!-- 2 · the wish -->
<section class="scene" id="s2">
  <div class="inner">
    <h2 class="wish fade" style="--d:.3">Make a wish.</h2>
    <div class="cake fade" id="cake" style="--d:.7" role="button" tabindex="0" aria-label="Blow out the candle">
      <svg viewBox="0 0 300 330" aria-hidden="true">
        <defs>
          <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7ec"/><stop offset="1" stop-color="#f2dcc4"/></linearGradient>
          <linearGradient id="rose" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7b8c4"/><stop offset="1" stop-color="#e58ea3"/></linearGradient>
          <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9a566"/><stop offset=".5" stop-color="#f7dba6"/><stop offset="1" stop-color="#d9a566"/></linearGradient>
          <linearGradient id="flameG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2b8"/><stop offset=".55" stop-color="#ffb347"/><stop offset="1" stop-color="#ff7a3d"/></linearGradient>
          <radialGradient id="glowG"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".75"/><stop offset=".45" stop-color="#ffb36b" stop-opacity=".22"/><stop offset="1" stop-color="#ffb36b" stop-opacity="0"/></radialGradient>
          <clipPath id="candleClip"><rect x="143" y="98" width="14" height="52" rx="3"/></clipPath>
        </defs>

        <circle id="glow" cx="150" cy="80" r="120" fill="url(#glowG)"/>

        <!-- plate -->
        <ellipse cx="150" cy="304" rx="132" ry="15" fill="url(#gold)"/>
        <ellipse cx="150" cy="300" rx="124" ry="11" fill="#f6e9d8"/>

        <!-- bottom tier -->
        <rect x="48" y="206" width="204" height="94" rx="12" fill="url(#cream)"/>
        <rect x="48" y="206" width="204" height="20" rx="10" fill="url(#rose)"/>
        <g fill="url(#rose)">
          <rect x="66" y="216" width="14" height="20" rx="7"/>
          <rect x="102" y="216" width="14" height="30" rx="7"/>
          <rect x="140" y="216" width="14" height="17" rx="7"/>
          <rect x="176" y="216" width="14" height="28" rx="7"/>
          <rect x="216" y="216" width="14" height="19" rx="7"/>
        </g>
        <rect x="48" y="272" width="204" height="5" fill="url(#gold)" opacity=".85"/>
        <g fill="#fff" opacity=".95">
          <circle cx="68" cy="274.5" r="3.4"/><circle cx="92" cy="274.5" r="3.4"/><circle cx="116" cy="274.5" r="3.4"/>
          <circle cx="140" cy="274.5" r="3.4"/><circle cx="164" cy="274.5" r="3.4"/><circle cx="188" cy="274.5" r="3.4"/>
          <circle cx="212" cy="274.5" r="3.4"/><circle cx="234" cy="274.5" r="3.4"/>
        </g>
        <g fill="#e2b674" opacity=".9">
          <circle cx="84" cy="252" r="2"/><circle cx="130" cy="256" r="2"/><circle cx="168" cy="250" r="2"/>
          <circle cx="204" cy="258" r="2"/><circle cx="228" cy="248" r="2"/>
        </g>

        <!-- top tier -->
        <rect x="84" y="146" width="132" height="66" rx="11" fill="url(#cream)"/>
        <rect x="84" y="146" width="132" height="18" rx="9" fill="url(#rose)"/>
        <g fill="url(#rose)">
          <rect x="100" y="155" width="12" height="16" rx="6"/>
          <rect x="126" y="155" width="12" height="27" rx="6"/>
          <rect x="160" y="155" width="12" height="18" rx="6"/>
          <rect x="188" y="155" width="12" height="25" rx="6"/>
        </g>
        <g fill="#e2b674" opacity=".9">
          <circle cx="108" cy="196" r="2"/><circle cx="146" cy="200" r="2"/><circle cx="178" cy="194" r="2"/><circle cx="198" cy="202" r="2"/>
        </g>

        <!-- candle -->
        <rect x="143" y="98" width="14" height="52" rx="3" fill="#fdf0e0"/>
        <g clip-path="url(#candleClip)" stroke="#f0a6b4" stroke-width="4">
          <path d="M141 112 l18 -7 M141 128 l18 -7 M141 144 l18 -7"/>
        </g>
        <rect x="149" y="89" width="2" height="10" fill="#3a2a2a"/>

        <!-- flame -->
        <g id="flame">
          <path d="M150 58 C159 71 162 81 150 92 C138 81 141 71 150 58 Z" fill="url(#flameG)"/>
          <path d="M150 71 C154 77 155 83 150 89 C145 83 146 77 150 71 Z" fill="#fffbe2" opacity=".92"/>
        </g>
      </svg>
      <span class="ring"></span>
      <span class="smoke" style="--sx:-10px;--sd:0s"></span>
      <span class="smoke" style="--sx:14px;--sd:.25s"></span>
      <span class="smoke" style="--sx:-2px;--sd:.5s"></span>
    </div>
    <p class="hint fade" id="hint" style="--d:1.5">Tap the candle to blow it out.</p>
    <button class="link fade" id="micBtn" style="--d:1.9">or blow into your microphone</button>
  </div>
</section>

<!-- 3 · the reveal -->
<section class="scene" id="s3">
  <div class="inner">
    <h2 class="title" id="title"><span class="l1" id="l1" aria-hidden="true"></span><span class="l2" id="l2" aria-hidden="true"></span></h2>
    <div class="rule fade" style="--d:1.9"></div>
    <p class="message fade" id="msg" style="--d:2.2"></p>
    <ul class="reasons" id="reasons"></ul>
    <p class="from fade" id="from"></p>
    <div class="again fade" id="againWrap"><button class="link" id="replay">Watch again</button></div>
  </div>
</section>

<script>
(() => {
  'use strict';

  /* =====================================================
     MAKE IT HERS — edit these, or use the link instead:
     birthday-surprise.html?name=Sara&from=Alex
     ===================================================== */
  const CONFIG = {
    name: '',      // her name
    from: '',      // your name
    message: "Another year, and the world is a little brighter with you in it. I hope today is gentle, a bit loud, very delicious, and completely yours.",
    reasons: [
      "You make ordinary days feel lighter.",
      "People are always glad when you walk in.",
      "You are easy to love, and impossible to replace."
    ]
  };

  const $  = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const q  = new URLSearchParams(location.search);
  const name = (q.get('name') || CONFIG.name || '').trim();
  const from = (q.get('from') || CONFIG.from || '').trim();
  const message = (q.get('msg') || CONFIG.message || '').trim();
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- copy ---------- */
  const forLine = $('#forLine');
  forLine.append('For ');
  const n = document.createElement('span'); n.className = 'n'; n.textContent = name || 'you';
  forLine.append(n);
  document.title = name ? `A little something for ${name}` : 'A little something for you';

  function buildLine(el, text, start){
    let i = start;
    text.split(' ').forEach((w, wi, arr) => {
      const word = document.createElement('span'); word.className = 'word';
      for (const c of w){
        const s = document.createElement('span'); s.className = 'ch'; s.textContent = c;
        s.style.setProperty('--i', i++); word.appendChild(s);
      }
      el.appendChild(word);
      if (wi < arr.length - 1) el.appendChild(document.createTextNode(' '));
    });
    return i;
  }
  let idx = buildLine($('#l1'), 'Happy Birthday', 0);
  if (name) buildLine($('#l2'), name, idx + 2);
  $('#title').setAttribute('aria-label', name ? `Happy Birthday, ${name}` : 'Happy Birthday');

  $('#msg').textContent = message;
  const list = $('#reasons');
  const reasons = (CONFIG.reasons || []).filter(Boolean);
  reasons.forEach((r, i) => {
    const li = document.createElement('li');
    li.className = 'fade'; li.textContent = r;
    li.style.setProperty('--d', (3.3 + i * 0.85).toFixed(2));
    list.appendChild(li);
  });
  const endD = 3.3 + reasons.length * 0.85 + 0.2;
  const fromEl = $('#from');
  if (from){ fromEl.textContent = `With love, ${from}`; fromEl.style.setProperty('--d', endD.toFixed(2)); }
  $('#againWrap').style.setProperty('--d', (endD + 1).toFixed(2));

  /* ---------- canvases ---------- */
  const bg = $('#bg'), fx = $('#fx');
  const bctx = bg.getContext('2d'), fctx = fx.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    [bg, fx].forEach(c => { c.width = W * DPR; c.height = H * DPR; });
    bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize); resize();

  /* soft drifting lights */
  let warmth = 0, warmTarget = 0;
  const orbs = Array.from({ length: 34 }, () => ({
    x: Math.random(), y: Math.random(), r: 10 + Math.random() * 36,
    a: .05 + Math.random() * .10, vy: .004 + Math.random() * .012,
    vx: (Math.random() - .5) * .004, h: (Math.random() - .5) * 46, ph: Math.random() * 6.28
  }));
  function drawBg(t, dt){
    warmth += (warmTarget - warmth) * Math.min(1, dt * .9);
    bctx.clearRect(0, 0, W, H);
    bctx.globalCompositeOperation = 'lighter';
    const mv = RM ? .15 : 1;
    for (const o of orbs){
      o.y -= o.vy * dt * mv; o.x += o.vx * dt * mv;
      if (o.y < -.12){ o.y = 1.12; o.x = Math.random(); }
      const x = o.x * W, y = o.y * H;
      const hue = (300 + warmth * 90 + o.h) % 360;
      const a = o.a * (1 + warmth * .7) * (.7 + .3 * Math.sin(t * .8 + o.ph));
      const g = bctx.createRadialGradient(x, y, 0, x, y, o.r);
      g.addColorStop(0, `hsla(${hue},85%,72%,${a})`);
      g.addColorStop(1, `hsla(${hue},85%,72%,0)`);
      bctx.fillStyle = g;
      bctx.beginPath(); bctx.arc(x, y, o.r, 0, 6.2832); bctx.fill();
    }
    bctx.globalCompositeOperation = 'source-over';
  }

  /* confetti — one clean burst, then a light drift */
  const parts = [];
  const COLORS = ['#f7d9a0', '#f0a6b4', '#fff4e6', '#c9b8ff', '#ffcf9e', '#e58ea3'];
  let rainUntil = 0;
  function spawn(x, y, ang, spd, spread){
    const a = ang + (Math.random() - .5) * spread;
    const s = spd * (.55 + Math.random() * .6);
    parts.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      w: 6 + Math.random() * 7, h: 3 + Math.random() * 5, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3,
      c: COLORS[(Math.random() * COLORS.length) | 0], circ: Math.random() < .25,
      life: 0, max: 3.6 + Math.random() * 2, ph: Math.random() * 6.28
    });
  }
  function burst(){
    const count = RM ? 24 : 64;
    const spd = Math.sqrt(2 * .3 * H * .68);
    for (let i = 0; i < count; i++){
      spawn(W * .06, H * .96, -Math.PI / 2 + .45, spd, .55);
      spawn(W * .94, H * .96, -Math.PI / 2 - .45, spd, .55);
    }
    rainUntil = performance.now() + (RM ? 0 : 3800);
  }
  function drawFx(dt, now){
    fctx.clearRect(0, 0, W, H);
    if (now < rainUntil && Math.random() < dt * 16){
      spawn(Math.random() * W, -12, Math.PI / 2, 1.6, .6);
    }
    const f = dt * 60;
    for (let i = parts.length - 1; i >= 0; i--){
      const p = parts[i];
      p.life += dt;
      p.vy += .3 * f;
      const d = Math.pow(.984, f);
      p.vx *= d; p.vy *= d;
      p.x += p.vx * f + Math.sin(p.life * 4 + p.ph) * .35 * f;
      p.y += p.vy * f; p.r += p.vr * f;
      if (p.life > p.max || p.y > H + 24){ parts.splice(i, 1); continue; }
      const alpha = p.life > p.max - 1 ? Math.max(0, p.max - p.life) : 1;
      fctx.save();
      fctx.globalAlpha = alpha;
      fctx.translate(p.x, p.y); fctx.rotate(p.r);
      fctx.fillStyle = p.c;
      if (p.circ){ fctx.beginPath(); fctx.arc(0, 0, p.h * .8, 0, 6.2832); fctx.fill(); }
      else { fctx.scale(1, Math.cos(p.life * 5 + p.ph)); fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      fctx.restore();
    }
  }
  let last = performance.now();
  (function frame(now){
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    drawBg(now / 1000, dt); drawFx(dt, now);
    requestAnimationFrame(frame);
  })(last);

  /* ---------- audio: a small music-box "Happy Birthday" ---------- */
  let ac = null, master = null, bus = null, muted = false;
  function initAudio(){
    if (ac){ if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = .9;
    const dly = ac.createDelay(1); dly.delayTime.value = .31;
    const fb = ac.createGain(); fb.gain.value = .3;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    const wet = ac.createGain(); wet.gain.value = .32;
    master.connect(ac.destination);
    master.connect(dly); dly.connect(lp); lp.connect(fb); fb.connect(dly); lp.connect(wet); wet.connect(ac.destination);
  }
  function tone(freq, t, dur){
    const env = (g, peak, len) => {
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(peak, t + .008);
      g.gain.exponentialRampToValueAtTime(.0001, t + len);
    };
    const o1 = ac.createOscillator(), g1 = ac.createGain();
    o1.type = 'sine'; o1.frequency.value = freq; env(g1, .17, Math.max(dur, .8) + .7);
    const o2 = ac.createOscillator(), g2 = ac.createGain();
    o2.type = 'sine'; o2.frequency.value = freq * 4; env(g2, .05, .5);
    o1.connect(g1); o2.connect(g2); g1.connect(bus); g2.connect(bus);
    o1.start(t); o2.start(t); o1.stop(t + dur + 1.8); o2.stop(t + 1);
  }
  const G4 = 7, A4 = 9, B4 = 11, C5 = 12, D5 = 14, E5 = 16, F5 = 17, G5 = 19;
  const MELODY = [
    [G4,.75],[G4,.25],[A4,1],[G4,1],[C5,1],[B4,2],
    [G4,.75],[G4,.25],[A4,1],[G4,1],[D5,1],[C5,2],
    [G4,.75],[G4,.25],[G5,1],[E5,1],[C5,1],[B4,1],[A4,1.5],
    [F5,.75],[F5,.25],[E5,1],[C5,1],[D5,1],[C5,2.5]
  ];
  function playMusic(){
    if (!ac) return;
    if (ac.state === 'suspended') ac.resume();
    if (bus) bus.disconnect();
    bus = ac.createGain(); bus.connect(master);
    const beat = .6; let t = ac.currentTime + .5;
    for (const [s, b] of MELODY){
      tone(261.63 * Math.pow(2, s / 12), t, b * beat);
      t += b * beat;
    }
  }
  function stopMusic(){ if (bus){ bus.disconnect(); bus = null; } }

  const soundBtn = $('#sound');
  soundBtn.addEventListener('click', () => {
    if (!ac) return;
    muted = !muted;
    master.gain.setTargetAtTime(muted ? 0 : .9, ac.currentTime, .05);
    soundBtn.classList.toggle('off', muted);
  });

  /* ---------- flow ---------- */
  const body = document.body;
  const cake = $('#cake'), hint = $('#hint'), micBtn = $('#micBtn');
  let blown = false, micStream = null, micRAF = 0, timers = [];

  function show(id){
    $$('.scene').forEach(s => s.classList.toggle('active', s.id === id));
    if (id === 's3') $('#s3').scrollTop = 0;
  }

  $('#openBtn').addEventListener('click', () => { initAudio(); show('s2'); });

  function blowOut(){
    if (blown) return;
    blown = true; stopMic();
    cake.classList.add('out');
    hint.classList.add('gone'); micBtn.classList.add('gone');
    body.classList.add('dark');
    timers.push(setTimeout(() => {
      body.classList.remove('dark');
      body.classList.add('lit');
      warmTarget = 1;
      show('s3');
      burst();
      playMusic();
      soundBtn.hidden = false;
      requestAnimationFrame(() => soundBtn.classList.add('show'));
    }, 1500));
  }
  cake.addEventListener('click', blowOut);
  cake.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); blowOut(); } });

  /* optional: blow into the mic (falls back quietly to tapping) */
  async function startMic(){
    if (micStream || blown) return;
    try{
      initAudio();
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      const src = ac.createMediaStreamSource(micStream);
      const an = ac.createAnalyser(); an.fftSize = 1024; src.connect(an);
      const buf = new Float32Array(an.fftSize);
      let loud = 0, prev = performance.now();
      micBtn.textContent = 'Listening… blow gently';
      const tick = () => {
        if (blown) return;
        an.getFloatTimeDomainData(buf);
        let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
        const rms = Math.sqrt(s / buf.length);
        const now = performance.now(), dt = now - prev; prev = now;
        loud = rms > .09 ? loud + dt : Math.max(0, loud - dt * 2);
        if (loud > 260) blowOut(); else micRAF = requestAnimationFrame(tick);
      };
      tick();
    }catch(e){
      micStream = null;
      micBtn.textContent = 'Microphone unavailable. Tap the candle instead.';
    }
  }
  function stopMic(){
    cancelAnimationFrame(micRAF);
    if (micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  }
  micBtn.addEventListener('click', startMic);

  /* watch again */
  $('#replay').addEventListener('click', () => {
    timers.forEach(clearTimeout); timers = [];
    stopMusic(); stopMic();
    blown = false; warmTarget = 0; parts.length = 0; rainUntil = 0;
    cake.classList.remove('out');
    hint.classList.remove('gone'); micBtn.classList.remove('gone');
    micBtn.textContent = 'or blow into your microphone';
    body.classList.remove('lit', 'dark');
    soundBtn.classList.remove('show');
    setTimeout(() => { soundBtn.hidden = true; }, 1200);
    show('s1');
  });
})();
</script>
</body>
</html>
